plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.trackauthoritymusic.flutter"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        multiDexEnabled true
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    if (keystorePropertiesFile.exists()) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    flavorDimensions "default"

    productFlavors {
        rapruler {
            dimension "default"
            applicationId 'com.therapruler'
            resValue "string", "app_name", "The Rap Ruler"
            resValue "string", "client_host", "therapruler.com"
            resValue "string", "app_id", "therapruler"
        }
        pickupmvp {
            dimension "default"
            applicationId 'com.pickupmvp'
            resValue "string", "app_name", "Pickup MVP"
            resValue "string", "client_host", "pickupmvp.com"
            resValue "string", "app_id", "pickupmvp"
        }
        trackauthoritymusic {
            dimension "default"
            applicationId 'com.trackauthoritymusic'
            resValue "string", "app_name", "Track Authority Music"
            resValue "string", "client_host", "trackauthoritymusic.com"
            resValue "string", "app_id", "trackauthoritymusic"
        }
        smsp {
            dimension "default"
            applicationId 'com.smsp.myapp'
            resValue "string", "app_name", "Strong Mind Strong Performance"
            resValue "string", "client_host", "webapp.strongmindstrongperformance.com"
            resValue "string", "app_id", "myapp"
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
